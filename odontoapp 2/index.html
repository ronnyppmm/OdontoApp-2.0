
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OdontoApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0ea5e9">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<div class="app">

<!-- ═══ SIDEBAR ═══ -->
<div class="sb">
  <div class="sb-logo" onclick="openLogoEdit()">
    <div class="sb-logo-img" id="logoIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 2C9.2 2 7 4.2 7 7c0 2 1 4 2.2 5.2L10.5 21c.2.8.8 1 1.5 1s1.3-.2 1.5-1l1.3-8.8C16 11 17 9 17 7c0-2.8-2.2-5-5-5z"/>
      </svg>
    </div>
    <div style="min-width:0">
      <div class="sb-logo-name" id="logoText">OdontoApp</div>
      <div class="sb-logo-prof" id="logoProfesional">Dr. Profesional</div>
    </div>
  </div>

  <div class="sb-nav">
    <div class="sb-section">General</div>
    <div class="sb-item active" id="nav-dashboard" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </div>
    <div class="sb-item" id="nav-agenda" onclick="showPage('agenda')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Agenda</span>
    </div>
    <div class="sb-item" id="nav-recordatorios" onclick="showPage('recordatorios')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Recordatorios</span>
    </div>
    <div class="sb-item" id="nav-estadisticas" onclick="showPage('estadisticas')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Estadísticas</span>
    </div>
    <div class="sb-item" id="nav-configuracion" onclick="showPage('configuracion')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Configuración</span>
    </div>
    <div class="sb-divider"></div>
  </div>

  <div class="sb-bottom">
    <div class="sb-pts-hdr">Pacientes</div>
    <div class="sb-search">
      <input type="text" id="searchInput" placeholder="🔍 Buscar..." data-on-input="patients.filter">
    </div>
    <div class="sb-pt-list" id="ptList"></div>
    <button class="sb-add" data-action="patients.openNew">+ Nuevo Paciente</button>
    <div style="display:flex;gap:6px;padding:0 10px 4px">
      <button onclick="prepararEmailBackup()" style="flex:1;padding:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#94a3b8;font-size:10px;font-weight:600;cursor:pointer;text-align:center" title="Exportar datos">⬇ Backup</button>
      <button onclick="importarDatos()" style="flex:1;padding:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#94a3b8;font-size:10px;font-weight:600;cursor:pointer;text-align:center" title="Importar datos">⬆ Importar</button>
    </div>
    <div style="padding:0 10px 12px">
      <button id="sbBtn" onclick="sbAction()" style="width:100%;padding:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#94a3b8;font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#3ecf8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="sbBtnText">Conectar Supabase</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;flex-shrink:0">
      <div class="tb-title" id="ptTitle">Dashboard</div>
      <span class="tb-badge" id="ptBadge" style="display:none"></span>
    </div>
    <div class="search-bar">
      <span class="s-icon">🔍</span>
      <input type="text" id="globalSearch" placeholder="Buscar paciente, cita, tratamiento..." autocomplete="off"
        data-on-input="search.run" data-on-keydown="search.keyNav" data-on-focusin="search.show" data-on-focusout="search.hideSoon">
      <span class="s-kbd">⌘K</span>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <button id="darkToggle" onclick="toggleDarkMode()" title="Modo oscuro" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s">🌙</button>
      <div class="tb-right" id="topActions"></div>
    </div>
  </div>
<div id="ptWinHeader"></div>
  <div class="tabs" id="tabsBar" style="display:none">
    <div class="tab active" onclick="switchTab('datos',this)">📄 Datos</div>
<div class="tab" onclick="switchTab('odontograma',this)">🦷 Odontograma</div>
<div class="tab" onclick="switchTab('diario',this)">📝 Diario Clínico</div>
<div class="tab" onclick="switchTab('tratamientos',this)">🪥 Tratamientos</div>
<div class="tab" onclick="switchTab('pagos',this)">💳 Pagos</div>
<div class="tab" onclick="switchTab('citas',this)">📅 Citas</div>
<div class="tab" onclick="switchTab('imagenes',this)">📷 Imágenes</div>
<div class="tab" onclick="switchTab('consentimientos',this)">📋 Consentimientos</div>
<div class="tab" onclick="switchTab('presupuestos',this)">💰 Presupuesto</div>
<div class="tab" onclick="switchTab('recetas',this)">💊 Recetas</div>
  </div>
  <div class="content" id="mainContent"></div>
</div>
</div>

<div class="tooth-popup" id="toothPopup">
  <div class="tp-title" id="tpTitle">Diente</div>
  <div id="tpOpts"></div>
  <div class="tp-clear" onclick="clearTooth()">🗑 Limpiar diente</div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script src="js/balance.js"></script>
<script src="js/ui.js"></script>
<script src="js/patients.js"></script>
<script src="js/chart.js"></script>
<script src="js/agenda.js"></script>
<script src="js/finance.js"></script>
<script src="js/clinical.js"></script>
<script src="js/recalls.js"></script>
<script src="js/sync.js"></script>
<script src="js/security.js"></script>
<script src="js/main.js"></script>
</body>
</html>
